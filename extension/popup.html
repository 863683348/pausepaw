<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 340px; font-family: system-ui, sans-serif; padding: 14px; color: #4A2E12; }
    h3 { margin: 0 0 8px; font-size: 16px; }
    input { width: 100%; padding: 9px; font-size: 12px; border: 1px solid #F1E2CE; border-radius: 8px; box-sizing: border-box; font-family: ui-monospace, monospace; }
    button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 999px; background: #FB923C; color: #fff; font-weight: 700; cursor: pointer; }
    button.ghost { background: #fff; color: #EA7A1F; border: 1px solid #F1E2CE; }
    .stats { margin-top: 12px; background: #FFE8D2; border-radius: 10px; padding: 10px; font-size: 13px; }
    .stats b { color: #EA7A1F; }
    .hint { font-size: 11px; color: #9A7B5A; margin-top: 6px; }
    .ok { color: #2E7D32; font-size: 12px; margin-top: 6px; }
    button.google { display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; color: #3C4043; border: 1px solid #DADCE0; font-weight: 600; }
    button.google:hover { background: #F8F9FA; }
    .gicon { flex: none; }
    .gstate { margin-top: 6px; font-size: 12px; min-height: 14px; }
    .gstate .ok { color: #2E7D32; }
    .gstate .err { color: #C0392B; }
  </style>
</head>
<body>
  <h3>PausePaw 守护</h3>
  <button id="googleLogin" class="google">
    <svg class="gicon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>使用 Google 登录
  </button>
  <div class="gstate"><span class="ok" id="gOk" style="display:none"></span><span class="err" id="gErr" style="display:none"></span></div>
  <div class="hint" style="margin-top:10px">或手动粘贴设备 Token（来自网站扩展页）：</div>
  <div class="hint">后端地址（部署后改成你的域名，如 https://pause-paw.shop）：</div>
  <input id="base" placeholder="https://pause-paw.shop" />
  <div class="hint">从网站「扩展」页复制你的设备 Token，粘贴到这里连接云端：</div>
  <input id="token" placeholder="设备 token（来自网站）" />
  <button id="connect">连接云端</button>
  <button id="disconnect" class="ghost">断开</button>
  <div class="ok" id="ok" style="display:none">已连接，规则每 30 秒自动同步</div>
  <div class="stats" id="stats">今日拦截：<b id="sBlocks">0</b> ｜ 省下：<b id="sSaved">0</b> 分钟</div>
  <div class="hint">演示建议：网站里阈值选“秒”、设 10。后台连续累计使用时长，到阈值整屏强制休息。</div>
  <script src="popup.js"></script>
</body>
</html>
